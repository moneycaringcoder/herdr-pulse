[package]
name = "pulse"
version = "0.1.1"
edition = "2021"
description = "Activity history and sparklines for herdr agents."
license = "MIT"
repository = "https://github.com/moneycaringcoder/herdr-pulse"

# The binary target inherits the package name => target/release/pulse, which is
# what every command in herdr-plugin.toml points at.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crook = { git = "https://github.com/moneycaringcoder/herdr-crook", rev = "ed0df17e2c515d94516f8ad088283896484fd71d" }

# Unix-only: setsid for daemon detachment, and SIGINT/SIGTERM shutdown plumbing.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
